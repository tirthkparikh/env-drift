apiVersion: apps/v1
kind: Deployment
metadata: { name: api }
spec:
  template:
    spec:
      containers:
        - name: api
          image: api
          env:
            - name: CELERY_BROKER_URL
              value: redis://redis:6379/0
---
apiVersion: v1
kind: ConfigMap
metadata: { name: cfg }
data:
  FEATURE_FLAGS: "a,b"
